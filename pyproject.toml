[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cliretry"
version = "0.1.0"
description = "Conservative, session-bound iTerm2 recovery for Codex CLI"
requires-python = ">=3.11"
dependencies = ["iterm2==2.25", "psutil>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
cliretry = "cliretry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires explicitly selected isolated iTerm2 test session"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
